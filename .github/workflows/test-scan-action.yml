name: Test complyctl-scan Action

on:
  push:
    branches: [feat/scan-action]
  workflow_dispatch:

jobs:
  test-install:
    name: "Test: Install + Version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install complyctl
        uses: ./.github/actions/complyctl-scan
        id: scan
        with:
          version: v1.0.0-alpha.0
          policy-id: __skip__

      - name: Verify binary
        run: |
          which complyctl
          complyctl version
          echo "Install: OK"
